<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register - Bus Ticketing System</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="index.html">Bus Ticketing System</a><a class="btn btn-outline-light btn-sm" href="index.html">Home</a></div></nav>
<main class="container py-5"><div class="row justify-content-center"><div class="col-md-8 col-lg-6"><div class="card form-card"><div class="card-body p-4"><h1 class="h3 mb-4">Create an account</h1>
    <form class="needs-validation" novalidate><div class="mb-3"><label class="form-label" for="fullName">Full name</label><input id="fullName" class="form-control" required><div class="invalid-feedback">Full name is required.</div></div><div class="mb-3"><label class="form-label" for="registerEmail">Email</label><input id="registerEmail" type="email" class="form-control" required><div class="invalid-feedback">Enter a valid email.</div></div><div class="mb-3"><label class="form-label" for="phone">Phone number</label><input id="phone" type="tel" class="form-control" pattern="[0-9]{10}" required><div class="invalid-feedback">Enter a 10-digit phone number.</div></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="password">Password</label><input id="password" type="password" class="form-control" minlength="6" required></div><div class="col-md-6 mb-3"><label class="form-label" for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" class="form-control" required><div class="invalid-feedback">Passwords must match.</div></div></div><button class="btn btn-primary w-100" type="submit">Register</button></form>
    <p class="text-center mt-3 mb-0">Already registered? <a href="login.html">Login</a></p>
</div></div></div></div></main><footer><div class="container text-center"><p class="mb-0">Frontend-only demonstration</p></div></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/script.js"></script></body></html>
