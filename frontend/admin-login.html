<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Login - Bus Ticketing System</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="index.html">Bus Ticketing System</a><a class="btn btn-outline-light btn-sm" href="index.html">Home</a></div></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card form-card"><div class="card-body p-4"><h1 class="h3 mb-4">Admin Login</h1><form class="needs-validation" action="admin-login" method="post" novalidate><div class="mb-3"><label class="form-label" for="adminEmail">Admin username/email</label><input id="adminEmail" name="username" type="email" class="form-control" required><div class="invalid-feedback">Enter an admin email.</div></div><div class="mb-3"><label class="form-label" for="adminPassword">Password</label><input id="adminPassword" name="password" type="password" class="form-control" required><div class="invalid-feedback">Password is required.</div></div><button class="btn btn-dark w-100" type="submit">Login as admin</button></form><p class="text-center mt-3 mb-0"><a href="index.html">Back to home</a></p></div></div></div></div></main><footer><div class="container text-center"><p class="mb-0">Admin authentication is handled by a Java Servlet when deployed on Tomcat.</p></div></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/script.js"></script></body></html>
