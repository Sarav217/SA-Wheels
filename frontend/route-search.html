<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search Routes - Bus Ticketing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">Bus Ticketing System</a>
            <div>
                <a class="btn btn-outline-light btn-sm me-2" href="user-dashboard.html">Dashboard</a>
                <a class="btn btn-light btn-sm" href="logout">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h1 class="h2 mb-4">Search Bus Routes</h1>
        <div class="card form-card mb-4">
            <div class="card-body">
                <form id="routeSearchForm" class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label" for="searchSource">Source</label>
                        <select id="searchSource" class="form-select" required>
                            <option value="">Choose source</option>
                            <option>Chennai Central</option>
                            <option>Koyambedu</option>
                            <option>Adyar</option>
                            <option>Velachery</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="searchDestination">Destination</label>
                        <select id="searchDestination" class="form-select" required>
                            <option value="">Choose destination</option>
                            <option>Tambaram</option>
                            <option>Guindy</option>
                            <option>Anna Nagar</option>
                            <option>T Nagar</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="searchDate">Travel date</label>
                        <input id="searchDate" type="date" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary" type="submit">Search routes</button>
                    </div>
                </form>
                <div id="searchMessage" class="alert alert-info mt-3 mb-0 d-none"></div>
            </div>
        </div>

        <!-- Route data is loaded from RouteSearchServlet when deployed on Tomcat. -->
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-primary">
                    <tr>
                        <th>Route ID</th>
                        <th>Source</th>
                        <th>Destination</th>
                        <th>Stops</th>
                        <th>Travel time</th>
                        <th>Departure</th>
                        <th>Arrival</th>
                        <th>Base fare</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="routeResults">
                    <tr><td colspan="9" class="text-center text-muted">Search for a route to view current database results.</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <div class="container text-center"><p class="mb-0">Routes are loaded from Oracle through the Java Servlet.</p></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
