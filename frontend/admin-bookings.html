<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1565C0">
    <title>Bookings - SA Wheels</title>
    <script src="js/prefs.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=13">
</head>
<body data-admin-page="bookings">
    <nav class="navbar navbar-expand-lg navbar-dark app-header">
        <div class="container">
            <a class="navbar-brand" href="admin-dashboard.html"><span class="brand-mark"><img class="brand-logo" src="assets/sa-logo.svg" alt=""></span><span class="brand-text">SA Wheels<span class="brand-sub">Admin console</span></span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="route-management.html">Routes</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin-bookings.html">Bookings</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin-users.html">Users</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin-reports.html">Reports</a></li>
                    <li class="nav-item"><a class="nav-link" href="logout">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container page">
        <div class="page-head">
            <div>
                <h1 class="h2 page-title"><span class="title-icon"><i class="bi bi-journal-text"></i></span>Bookings</h1>
                <p class="page-sub">Every booking with passenger, route, fare and status.</p>
            </div>
        </div>
        <div id="adminMessage" class="alert d-none"></div>
        <div class="card">
            <div class="card-body">
                <div class="row g-2 align-items-center mb-3">
                    <div class="col-md-6"><label class="visually-hidden" for="bookingSearch">Search bookings</label><input id="bookingSearch" type="search" class="form-control" placeholder="Search by passenger, email, route or booking ID"></div>
                    <div class="col-7 col-md-3"><label class="visually-hidden" for="bookingStatusFilter">Status</label><select id="bookingStatusFilter" class="form-select"><option value="">All statuses</option><option value="CONFIRMED">Confirmed</option><option value="PENDING">Pending</option><option value="CANCELLED">Cancelled</option></select></div>
                    <div class="col-5 col-md-3 text-end text-muted small" id="bookingCount"></div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead><tr><th>Booking</th><th>Passenger</th><th>Route</th><th>Travel date</th><th>Passengers</th><th>Seat</th><th>Fare</th><th>Status</th><th>Booked on</th></tr></thead>
                        <tbody id="adminBookingResults"><tr><td colspan="9" class="text-center text-muted">Loading bookings...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="app-footer no-print"><div class="container"><span>&copy; 2026 SA Wheels</span><span>Showing the latest 200 bookings.</span></div></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js?v=13"></script>
    <script src="js/ui-effects.js"></script>
</body>
</html>
