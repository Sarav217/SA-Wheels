<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invoice - Bus Ticketing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary no-print"><div class="container"><a class="navbar-brand" href="index.html">Bus Ticketing System</a><a class="btn btn-outline-light btn-sm" href="user-dashboard.html">Dashboard</a></div></nav>
    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4 no-print"><h1 class="h2 mb-0">Booking Invoice</h1><button data-print class="btn btn-outline-primary">Print Invoice</button></div>
        <div class="card invoice-card"><div class="card-body p-4">
            <div class="row mb-4"><div class="col"><h2 class="h4">Public Transport Bus Ticketing System</h2><p class="text-muted mb-0">Booking invoice</p></div><div class="col text-end"><strong id="invoiceNumber">Invoice -</strong><br><span id="invoiceDate" class="text-muted">-</span></div></div>
            <div class="table-responsive"><table class="table"><tbody>
                <tr><th>Booking ID</th><td id="invoiceBookingId">-</td></tr>
                <tr><th>Passenger name</th><td id="invoicePassenger">-</td></tr>
                <tr><th>Route</th><td id="invoiceRoute">-</td></tr>
                <tr><th>Number of passengers</th><td id="invoicePassengerCount">-</td></tr>
                <tr><th>Total amount</th><td><strong id="invoiceAmount">-</strong></td></tr>
                <tr><th>Payment method</th><td id="invoicePaymentMethod">-</td></tr>
                <tr><th>Payment status</th><td><span id="invoicePaymentStatus" class="badge text-bg-success">-</span></td></tr>
            </tbody></table></div>
        </div></div>
    </main>
    <footer class="no-print"><div class="container text-center"><p class="mb-0">Invoice details are loaded for the logged-in user.</p></div></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/script.js"></script>
</body>
</html>
