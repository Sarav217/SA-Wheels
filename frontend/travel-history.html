<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travel History - Bus Ticketing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="index.html">Bus Ticketing System</a><div><a class="btn btn-outline-light btn-sm me-2" href="user-dashboard.html">Dashboard</a><a class="btn btn-light btn-sm" href="logout">Logout</a></div></div></nav>
    <main class="container py-5">
        <h1 class="h2 mb-4">Travel History</h1>
        <div id="historyMessage" class="alert alert-info">Loading your bookings...</div>
        <div class="table-responsive"><table class="table table-striped align-middle"><thead class="table-primary"><tr><th>Booking ID</th><th>Date</th><th>Source</th><th>Destination</th><th>Passengers</th><th>Fare</th><th>Status</th><th>View</th></tr></thead><tbody id="historyResults"><tr><td colspan="8" class="text-center text-muted">Loading...</td></tr></tbody></table></div>
    </main>
    <footer><div class="container text-center"><p class="mb-0">Your previous bookings are loaded from Oracle.</p></div></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/script.js"></script>
</body>
</html>
