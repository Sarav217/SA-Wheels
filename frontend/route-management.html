<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Route Management - Bus Ticketing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Bus Ticketing System Admin</a>
            <div>
                <a class="btn btn-outline-light btn-sm me-2" href="admin-dashboard.html">Dashboard</a>
                <a class="btn btn-light btn-sm" href="logout">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h1 class="h2 mb-4">Route Management</h1>
        <div id="routeManagementMessage" class="alert d-none"></div>

        <div class="card form-card mb-5">
            <div class="card-body">
                <h2 class="h5">Add or Edit Route</h2>
                <form id="routeManagementForm" class="row g-3">
                    <input id="routeDbId" type="hidden">
                    <div class="col-md-2">
                        <label class="form-label" for="routeNumber">Route number</label>
                        <input id="routeNumber" class="form-control" placeholder="R501" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="routeSource">Source</label>
                        <input id="routeSource" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="routeDestination">Destination</label>
                        <input id="routeDestination" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="departure">Departure</label>
                        <input id="departure" type="time" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="arrival">Arrival</label>
                        <input id="arrival" type="time" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="fare">Base fare</label>
                        <input id="fare" type="number" min="0" step="0.01" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <button id="routeSubmitButton" class="btn btn-dark" type="submit">Add Route</button>
                        <button id="routeCancelButton" class="btn btn-outline-secondary d-none" type="button">Cancel edit</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Route data is loaded from RouteManagementServlet when deployed on Tomcat. -->
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Route ID</th>
                        <th>Route number</th>
                        <th>Source</th>
                        <th>Destination</th>
                        <th>Departure</th>
                        <th>Arrival</th>
                        <th>Base fare</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="routeManagementResults">
                    <tr><td colspan="8" class="text-center text-muted">Loading routes...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <div class="container text-center"><p class="mb-0">Route changes are saved through the Java Servlet and Oracle database.</p></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
