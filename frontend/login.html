<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login - Bus Ticketing System</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="index.html">Bus Ticketing System</a><a class="btn btn-outline-light btn-sm" href="index.html">Home</a></div></nav>
<main class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card form-card auth-card"><div class="card-body p-4"><div class="auth-icon"><i class="bi bi-person-circle"></i></div><h1 class="h3 mb-1 text-center">User Login</h1><p class="text-muted text-center mb-4">Welcome back! Sign in to book your ride.</p>
    <form class="needs-validation" action="login" method="post" novalidate><div class="mb-3"><label class="form-label" for="email">Email</label><input id="email" name="email" type="email" class="form-control" required><div class="invalid-feedback">Enter a valid email address.</div></div><div class="mb-3"><label class="form-label" for="loginPassword">Password</label><input id="loginPassword" name="password" type="password" class="form-control" required><div class="invalid-feedback">Password is required.</div></div><button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right me-1"></i>Login</button></form>
    <p class="text-center mt-3 mb-0">New user? <a href="register.html">Register here</a></p><p class="text-center mt-2 mb-0"><a href="index.html">Back to home</a></p>
</div></div></div></div></main><footer><div class="container text-center"><p class="mb-0">Authentication is handled by a Java Servlet when deployed on Tomcat.</p></div></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/script.js"></script><script src="js/ui-effects.js"></script></body></html>
