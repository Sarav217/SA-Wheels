<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1565C0">
    <title>Login - SA Wheels</title>
    <script src="js/prefs.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=13">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark app-header">
        <div class="container">
            <a class="navbar-brand" href="index.html"><span class="brand-mark"><img class="brand-logo" src="assets/sa-logo.svg" alt=""></span><span class="brand-text">SA Wheels<span class="brand-sub">Bus ticketing</span></span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="route-search.html">Routes</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container auth-wrap">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-7 col-lg-5">
                <div class="card auth-card">
                    <div class="card-body">
                        <div class="auth-icon"><i class="bi bi-person-circle"></i></div>
                        <h1 class="h3 mb-1 text-center">User Login</h1>
                        <p class="text-muted text-center mb-4">Welcome back! Sign in to book your ride.</p>
                        <form class="needs-validation" action="login" method="post" novalidate>
                            <div class="mb-3"><label class="form-label" for="email">Email</label><input id="email" name="email" type="email" class="form-control" autocomplete="email" placeholder="you@example.com" required><div class="invalid-feedback">Enter a valid email address.</div></div>
                            <div class="mb-4"><label class="form-label" for="loginPassword">Password</label><input id="loginPassword" name="password" type="password" class="form-control" autocomplete="current-password" required><div class="invalid-feedback">Password is required.</div></div>
                            <div class="chooser-actions">
                                <a class="btn btn-outline-primary btn-lg" href="index.html?login=choose"><i class="bi bi-arrow-left me-1"></i>Back</a>
                                <button class="btn btn-primary btn-lg" type="submit"><i class="bi bi-box-arrow-in-right me-1"></i>Login</button>
                            </div>
                        </form>
                        <p class="text-center mt-4 mb-0">New user? <a href="register.html">Register here</a></p>
                        <p class="text-center mt-2 mb-0 small"><a href="admin-login.html">Admin login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="app-footer no-print"><div class="container"><span>&copy; 2026 SA Wheels</span><span>Authentication is handled by a Java Servlet.</span></div></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js?v=13"></script>
    <script src="js/ui-effects.js"></script>
</body>
</html>
